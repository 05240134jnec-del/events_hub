<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub — Home</title>

  <!-- 1. Bootstrap CSS (framework) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 2. Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- 3. YOUR CSS last so you can override Bootstrap -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="top">
    <h1 class="hero-title">JNEC Events Hub</h1>
    <nav>
      <a href="index.html" title="Go to home page">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Bootstrap carousel using real event photos -->
    <div id="eventCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="media/hackathon.jpeg" class="d-block w-100" alt="Youth Tech-Novation Hackathon 2026">
          <div class="carousel-caption d-none d-md-block">
            <h5>Tech Week Hackathon</h5>
          </div>
        </div>
        <div class="carousel-item">
          <img src="media/Losar.jpg" class="d-block w-100" alt="Losar festival spread">
          <div class="carousel-caption d-none d-md-block">
            <h5>Losar Festival Night</h5>
          </div>
        </div>
        <div class="carousel-item">
          <img src="media/football_final.jpeg" class="d-block w-100" alt="Inter-college football final">
          <div class="carousel-caption d-none d-md-block">
            <h5>Inter-College Football</h5>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#eventCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#eventCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <div class="container py-4">
      <section id="welcome" class="intro">
       <p id="welcomeMsg">Welcome.</p> 
        <p>The <strong>Events Hub</strong> lists every upcoming event at
           <em>Jigme Namgyel Engineering College</em>.
           <span class="highlight" title="Registrations close 3 days before each event">Register early!</span></p>
        <img src="media/jnec_campus.jpg" alt="JNEC campus" class="img-fluid rounded" title="Our campus in Dewathang">
      </section>

      <section id="location">
        <h2>Find Us</h2>
        <div class="ratio ratio-16x9">
          <iframe
            src="https://www.openstreetmap.org/export/embed.html?bbox=91.44,26.85,91.48,26.88"
            title="Campus map"></iframe>
        </div>
      </section>
    </div>
  </main>

  <footer> 
  <p>&copy; <span id="year"></span> JNEC Events Hub</p> 
   </footer> 


  <!-- Bootstrap JS — must be last, needed for the carousel -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/main.js"> 
  </script>
</body>
</html>
